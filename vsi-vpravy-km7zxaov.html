<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Усі вправи</title>
<style>
  :root {
    --bg: #f6f3ee;
    --card: #ffffff;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --accent: #3b6fd8;
    --border: #e3ddd3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  a.card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    color: inherit;
    text-decoration: none;
    transition: transform .1s, border-color .15s;
  }
  a.card:hover { transform: translateY(-2px); border-color: var(--accent); }
  .icon { font-size: 2rem; }
  .card h2 { font-size: 1.1rem; margin: 8px 0 4px; }
  .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Усі вправи</h1>
  <p class="lead">Особистий список. Ця сторінка не пов’язана з жодною іншою — зберігайте її адресу.</p>

  <div class="grid">
    <!-- Нові вправи додаються сюди: скопіюйте блок <a class="card">…</a> -->
    <a class="card" href="kanikuly-acrkc6/">
      <div class="icon">🍂</div>
      <h2>Осіннє перезавантаження</h2>
      <p>Для вчителів: 15 карток перед осінніми канікулами.</p>
    </a>
  </div>

</main>
</body>
</html>
